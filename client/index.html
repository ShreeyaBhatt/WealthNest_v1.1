<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="WealthNest – AI-powered Family Investment Portfolio Tracker. Track mutual funds, stocks, gold, FDs, and more. Get ML-based insights and AI recommendations." />
    <meta name="keywords" content="investment tracker, portfolio management, family investments, mutual funds, stocks, AI financial advisor" />
    <meta name="author" content="WealthNest" />

    <!-- Open Graph (for sharing on social media) -->
    <meta property="og:title" content="WealthNest – Family Investment Portfolio Tracker" />
    <meta property="og:description" content="Manage your family's investments with AI-powered insights" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts — Inter for clean, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>WealthNest – Family Investment Portfolio Tracker</title>

  <body>
    <!--
      WHY id="root"?
      React renders the entire application inside this div.
      React replaces this div's content with the React component tree.
      This is the "Single Page Application" (SPA) pattern.
    -->
    <div id="root"></div>

    <!-- Vite injects the React bundle here during build -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
